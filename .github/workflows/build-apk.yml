name: Build Catoid APK

on:
  push:
    branches: [ "master", "main", "develop" ]
  workflow_dispatch: # Essa linha é mágica: permite você apertar um botão para compilar quando quiser

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Java (JDK 21)
      uses: actions/setup-java@v4
      with:
        java-version: '21' # O Catroid moderno usa Java 21
        distribution: 'temurin'
        cache: gradle

    - name: Dar permissão ao script do Gradle
      run: chmod +x ./gradlew

    - name: Compilar o aplicativo (Gerar APK)
      run: ./gradlew assembleDebug --no-daemon

    - name: Salvar o APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: Catoid-APK
        # O asterisco duplo busca o APK gerado em qualquer pasta dentro de outputs
        path: '**/build/outputs/apk/**/*.apk'
